<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trip list</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
</style>
</helmet>
<div style="width: 100%; min-height: 900px; display: flex; flex-direction: column; background: {{c.bg}}; color: {{c.text}}; font-family: Manrope, system-ui, sans-serif; font-size: 14px">

<header style="height: 56px; flex: none; display: flex; align-items: center; gap: 16px; padding: 0 16px; background: {{c.surface}}; border-bottom: 1px solid {{c.border}}">
<span style="display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 17px; letter-spacing: -0.02em">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 18c4-1 5-6 9-6s5 5 9 4" stroke="{{c.route}}" stroke-width="3" stroke-linecap="round"></path><circle cx="3" cy="18" r="2" fill="{{c.text}}"></circle><circle cx="21" cy="16" r="2" fill="{{c.text}}"></circle></svg>
wayline</span>
<div style="flex: 1"></div>
<button type="button" aria-label="Settings" style="width: 36px; height: 36px; border-radius: 4px; border: none; background: transparent; color: {{c.text}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg></button>
<span aria-label="Signed in as P" style="width: 32px; height: 32px; border-radius: 999px; background: {{c.accentSoft}}; color: {{c.text}}; font-weight: 800; display: flex; align-items: center; justify-content: center">P</span>
</header>

<main style="width: 100%; max-width: 1120px; margin: 0 auto; box-sizing: border-box; padding: 40px 24px; display: flex; flex-direction: column; gap: 32px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap">
<h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.02em">Trips</h1>
<a href="NewTrip.dc.html" style="font-weight: 800; height: 40px; padding: 0 16px; border-radius: 4px; background: {{c.accent}}; color: {{c.onAccent}}; display: flex; align-items: center; gap: 8px; text-decoration: none">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
New trip</a>
</div>

<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
<div style="border: 1px dashed {{c.border}}; border-radius: 8px; padding: 64px 24px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; background: {{c.surface}}">
<svg width="120" height="48" viewBox="0 0 120 48" fill="none" aria-hidden="true"><path d="M6 40c20-4 24-28 44-28s22 22 40 20 20-16 24-20" stroke="{{c.route}}" stroke-width="4" stroke-linecap="round"></path><circle cx="6" cy="40" r="5" fill="{{c.text}}"></circle><circle cx="114" cy="12" r="5" fill="{{c.text}}"></circle></svg>
<span style="font-weight: 800; font-size: 18px">No trips yet</span>
<span style="color: {{c.muted}}; max-width: 380px; line-height: 1.5">Pick a region and a few numbers. Wayline suggests routes, stops and hotels.</span>
<a href="NewTrip.dc.html" style="font-weight: 800; height: 40px; padding: 0 16px; border-radius: 4px; background: {{c.accent}}; color: {{c.onAccent}}; display: flex; align-items: center; text-decoration: none">Plan your first trip</a>
</div>
</sc-if>

<sc-if value="{{notEmpty}}" hint-placeholder-val="{{ true }}">
<section style="display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 15px; font-weight: 700; color: {{c.muted}}">Your trips</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px">
<sc-for list="{{mine}}" as="t" hint-placeholder-count="3">
<a href="TripEditor.dc.html" style="display: flex; flex-direction: column; border-radius: 8px; border: 1px solid {{c.border}}; background: {{c.surface}}; overflow: hidden; text-decoration: none; color: {{c.text}}">
<svg width="100%" height="120" viewBox="0 0 300 120" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="display: block; background: {{c.mapLand}}">
<path d="M0 90 C60 80 100 60 150 70 C200 80 240 50 300 40" fill="none" stroke="{{c.mapWater}}" stroke-width="5"></path>
<path d="{{t.path}}" fill="none" stroke="{{c.casing}}" stroke-width="7" stroke-linecap="round"></path>
<path d="{{t.path}}" fill="none" stroke="{{c.route}}" stroke-width="4" stroke-linecap="round"></path>
</svg>
<div style="padding: 14px; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
<span style="font-weight: 800; font-size: 16px">{{t.name}}</span>
<span style="font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: {{c.hover}}; white-space: nowrap">{{t.kind}}</span>
</div>
<span style="font-size: 13px; color: {{c.muted}}">{{t.dates}}</span>
<span style="font-size: 13px; font-variant-numeric: tabular-nums">{{t.stats}}</span>
</div>
</a>
</sc-for>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 15px; font-weight: 700; color: {{c.muted}}">Shared with you</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px">
<a href="TripEditor.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 8px; border: 1px solid {{c.border}}; background: {{c.surface}}; text-decoration: none; color: {{c.text}}">
<span style="width: 36px; height: 36px; flex: none; border-radius: 999px; background: {{c.hover}}; font-weight: 800; display: flex; align-items: center; justify-content: center">M</span>
<div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span style="font-weight: 700">Altmühl valley weekend</span>
<span style="font-size: 12px; color: {{c.muted}}">From Markus · 2 days · 128 km</span>
</div>
</a>
</div>
</section>
</sc-if>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"empty":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var dark = this.props.dark ?? false;
    var empty = this.props.empty ?? false;
    var light = {
      bg: '#F6F7F9', surface: '#FFFFFF', text: '#15181D', muted: '#5A616C', border: '#E1E4EA', hover: '#EEF0F4',
      accent: '#FFB088', onAccent: '#3B1503', accentSoft: '#FFEDE3', route: '#FF9A73', casing: '#B4532A',
      mapLand: '#F1F2F4', mapWater: '#C9E0F5'
    };
    var darkT = {
      bg: '#101216', surface: '#171A20', text: '#EDEFF3', muted: '#A0A7B3', border: '#2A2F38', hover: '#20242C',
      accent: '#FFB088', onAccent: '#2A0F02', accentSoft: '#2D211B', route: '#FFA67F', casing: '#171A1F',
      mapLand: '#171A1F', mapWater: '#1E2E40'
    };
    var c = dark ? darkT : light;
    var mine = [
      { name: 'Franconia, four days', kind: 'One-way', dates: 'Sat 12 Jun – Tue 15 Jun', stats: '252 km · 2,340 m · 4 stages', path: 'M30 95 C70 60 90 70 120 40 C150 20 190 50 210 45 C240 40 250 70 270 90' },
      { name: 'Lake Constance loop', kind: 'Multi-day loop', dates: 'No date yet', stats: '274 km · 1,410 m · 3 stages', path: 'M150 100 C80 100 40 70 60 40 C80 15 140 20 180 25 C230 30 270 60 240 90 C220 105 180 100 150 100' },
      { name: 'Sunday from Bamberg', kind: 'Day loop', dates: 'Sun 6 Jun', stats: '64 km · 520 m', path: 'M60 80 C80 40 140 20 190 35 C240 50 230 95 180 100 C130 105 70 100 60 80' }
    ];
    return { c: c, mine: mine, empty: empty, notEmpty: !empty };
  }
}
</script>
</body>
</html>
