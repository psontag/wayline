<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Panel C, trip overview</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.wl{--bg:#F6F7F9;--surface:#FFFFFF;--raised:#FFFFFF;--text:#15181D;--muted:#5A616C;--border:#E1E4EA;--accent:#FFB088;--on-accent:#3B1503;--hover:#EEF0F4;--active:#E4E7EC;--selected:#FFEDE3;--selected-border:#B4532A;--success:#2F9E6B;--warning:#B7791F;--paved:#7E8BA3;--gravel:#E8B850;--unpaved:#B98E73;--stage-a:#FFC7AE;--stage-b:#C9BDE6;--marker:#15181D;--wind-tail:#2F9E6B;font-family:Manrope,system-ui,sans-serif;color:var(--text);font-variant-numeric:tabular-nums}
.wl[data-theme=dark]{--bg:#101216;--surface:#171A20;--raised:#1E222A;--text:#EDEFF3;--muted:#A0A7B3;--border:#2A2F38;--on-accent:#2A0F02;--hover:#20242C;--active:#2A2F38;--selected:#2D211B;--selected-border:#FFB088;--success:#5CCB97;--warning:#F2CF7E;--paved:#AEB9CC;--gravel:#F2CF7E;--unpaved:#D9B49C;--stage-a:#C98C72;--stage-b:#8F82B8;--marker:#EDEFF3;--wind-tail:#5CCB97}
.wl svg.i{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wl button{font:inherit;color:inherit;cursor:pointer}
</style>
</helmet>
<div class="wl" data-theme="{{theme}}" style="width:440px;height:1000px;box-sizing:border-box;background:var(--surface);display:flex;flex-direction:column;gap:20px;padding:16px;overflow:hidden">

  <section style="display:flex;flex-direction:column;gap:10px">
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
      <div style="display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:6px;background:var(--bg)">
        <span style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)"><svg class="i" viewBox="0 0 24 24" style="width:12px;height:12px" aria-hidden="true"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>Days</span>
        <span style="font-size:18px;font-weight:800">3</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:6px;background:var(--bg)">
        <span style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)"><svg class="i" viewBox="0 0 24 24" style="width:12px;height:12px" aria-hidden="true"><path d="m18 8 4 4-4 4M6 8l-4 4 4 4M2 12h20"/></svg>Distance</span>
        <span style="font-size:18px;font-weight:800">207 km</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:6px;background:var(--bg)">
        <span style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)"><svg class="i" viewBox="0 0 24 24" style="width:12px;height:12px" aria-hidden="true"><path d="m22 7-8.5 8.5-5-5L2 17"/><path d="M16 7h6v6"/></svg>Ascent</span>
        <span style="font-size:18px;font-weight:800">1,831 m</span>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:4px">
      <div style="display:flex;height:6px;border-radius:9999px;overflow:hidden"><span style="width:93%;background:var(--paved)"></span><span style="width:4%;background:var(--gravel)"></span><span style="width:3%;background:var(--unpaved)"></span></div>
      <span style="font-size:11px;color:var(--muted)">93% paved · 4% gravel · 3% unpaved</span>
    </div>
  </section>

  <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:6px;background:var(--hover)">
    <svg class="i" viewBox="0 0 24 24" style="width:16px;height:16px;color:var(--wind-tail)" aria-label="Wind"><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/><path d="M9.6 4.6A2 2 0 1 1 11 8H2"/><path d="M12.6 19.4A2 2 0 1 0 14 16H2"/></svg>
    <span style="flex:1;font-size:12px"><b style="font-weight:700">Start a day later</b> <span style="color:var(--muted)">· headwind drops from 48% to 21%</span></span>
    <button style="height:28px;padding:0 10px;border:1px solid var(--border);border-radius:4px;background:var(--surface);font-size:12px;font-weight:600">Try it</button>
  </div>

  <section style="display:flex;flex-direction:column;gap:6px">
    <div style="display:flex;align-items:center;gap:10px;padding:8px 4px;color:var(--muted);font-size:12px">
      <svg class="i" viewBox="0 0 24 24" aria-label="Train"><path d="M8 3.1V7a4 4 0 0 0 8 0V3.1"/><path d="m9 15-1-1M15 15l1-1"/><path d="M9 19c-2.8 0-5-2.2-5-5v-4a8 8 0 0 1 16 0v4c0 2.8-2.2 5-5 5Z"/><path d="m8 19-2 3M16 19l2 3"/></svg>
      <span style="flex:1">Train to <b style="color:var(--text);font-weight:600">Heidelberg-Weststadt/Südstadt</b></span>
      <button style="height:26px;padding:0 8px;border:0;border-radius:4px;background:var(--hover);font-size:12px;font-weight:600">Show</button>
    </div>

    <sc-for list="{{days}}" as="d" hint-placeholder-count="3">
      <button style="{{d.style}}">
        <span style="{{d.bar}}"></span>
        <span style="flex:1;display:flex;flex-direction:column;gap:4px;padding:10px 4px 10px 0;min-width:0">
          <span style="display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;color:var(--muted)">
            Day {{d.n}} · {{d.date}}
            <sc-if value="{{d.tag}}" hint-placeholder-val="{{ false }}"><span style="padding:1px 6px;border-radius:4px;background:var(--hover);color:var(--text)">{{d.tag}}</span></sc-if>
          </span>
          <span style="display:flex;align-items:baseline;gap:8px">
            <span style="flex:1;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{d.place}}</span>
            <span style="font-size:13px;font-weight:700">{{d.dist}}</span>
            <span style="font-size:13px;font-weight:600;color:var(--muted)">{{d.asc}}</span>
          </span>
          <span style="font-size:12px;color:var(--muted)">{{d.weather}}</span>
          <sc-if value="{{d.hotel}}" hint-placeholder-val="{{ true }}">
            <span style="display:flex;align-items:center;gap:6px;font-size:12px"><svg class="i" viewBox="0 0 24 24" style="width:12px;height:12px;color:var(--muted)" aria-label="Hotel"><path d="M2 20v-8a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v8"/><path d="M4 10V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v4"/><path d="M12 4v6M2 18h20"/></svg>{{d.hotel}}</span>
          </sc-if>
        </span>
        <svg class="i" viewBox="0 0 24 24" style="align-self:center;margin-right:10px;color:var(--muted)" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </button>
    </sc-for>

    <div style="display:flex;align-items:center;gap:10px;padding:8px 4px;color:var(--muted);font-size:12px">
      <svg class="i" viewBox="0 0 24 24" aria-label="Train"><path d="M8 3.1V7a4 4 0 0 0 8 0V3.1"/><path d="m9 15-1-1M15 15l1-1"/><path d="M9 19c-2.8 0-5-2.2-5-5v-4a8 8 0 0 1 16 0v4c0 2.8-2.2 5-5 5Z"/><path d="m8 19-2 3M16 19l2 3"/></svg>
      <span style="flex:1">Train from <b style="color:var(--text);font-weight:600">Heilbronn Sülmertor</b></span>
      <button style="height:26px;padding:0 8px;border:0;border-radius:4px;background:var(--hover);font-size:12px;font-weight:600">Show</button>
    </div>
  </section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const days = [
      { n: 1, date: 'Sun 8 Nov', place: 'Dallau', dist: '65 km', asc: '576 m', weather: '3–9 °C · dry · 77% crosswind', hotel: 'Langsthof "Zur Pfalz"', tag: 'Locked', color: 'var(--stage-a)' },
      { n: 2, date: 'Mon 9 Nov', place: 'Bofsheim', dist: '76 km', asc: '717 m', weather: '4–10 °C · 0.4 mm · 62% headwind', hotel: 'Gasthaus "Zum Ochsen"', tag: '', color: 'var(--stage-b)' },
      { n: 3, date: 'Tue 10 Nov', place: 'Heilbronn Sülmertor', dist: '66 km', asc: '538 m', weather: '5–11 °C · dry · 54% tailwind', hotel: '', tag: '', color: 'var(--stage-a)' }
    ].map((d) => ({
      ...d,
      style: 'display:flex;align-items:stretch;gap:12px;padding:0;border:1px solid var(--border);border-radius:6px;background:var(--surface);text-align:left;overflow:hidden',
      bar: 'width:4px;flex:none;background:' + d.color
    }));
    return { theme: this.props.theme ?? 'light', days };
  }
}
</script>
</body>
</html>
