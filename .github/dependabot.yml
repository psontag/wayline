version: 2
updates:
  # One entry at the workspace root, so updates also change pnpm-lock.yaml.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Matches minimumReleaseAge in pnpm-workspace.yaml.
    cooldown:
      default-days: 14
    ignore:
      # typescript-eslint does not support TypeScript 7 yet.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Types must match the Node major in .nvmrc.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns:
          - "*"
