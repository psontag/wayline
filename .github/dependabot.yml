version: 2
updates:
  # One entry at the workspace root, so updates also change pnpm-lock.yaml.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Matches minimumReleaseAge in pnpm-workspace.yaml.
    cooldown:
      default-days: 14
    groups:
      npm:
        patterns:
          - "*"
