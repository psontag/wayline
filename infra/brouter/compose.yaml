# Local BRouter. Start with `pnpm brouter`, which downloads the segments first.
# With a Cloudflare token in .cloudflare.env it also starts cloudflared, so
# the deployed Worker reaches BRouter through the tunnel.
name: wayline-brouter

services:
  brouter:
    build: .
    image: wayline-brouter:1.7.10
    ports:
      - "127.0.0.1:17777:17777"
    volumes:
      - ../../.cache/brouter/segments4:/brouter/segments4:ro
      - ./profiles:/wayline/profiles:ro
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on: [brouter]
    profiles: [tunnel]
    restart: unless-stopped
